name: Publish to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'src/Xdk/Xdk.csproj'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Xdk/Xdk.csproj | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git show HEAD~1:src/Xdk/Xdk.csproj > /tmp/old.csproj 2>/dev/null || {
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          }

          OLD_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' /tmp/old.csproj | head -n 1 || echo "")

          if [ "$VERSION" != "$OLD_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, Test, and Pack
        run: |
          dotnet build -c Release --nologo -warnaserror
          dotnet test -c Release --no-build --nologo
          dotnet pack src/Xdk/Xdk.csproj -c Release --no-build --nologo -o artifacts

      - name: NuGet login (OIDC trusted publishing -> short-lived key)
        id: nuget-login
        env:
          HAS_NUGET_USER: ${{ secrets.NUGET_USER }}
        if: ${{ env.HAS_NUGET_USER != '' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          EFFECTIVE_NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$EFFECTIVE_NUGET_KEY" ]; then
            echo "::warning::Neither NUGET_USER (OIDC Trusted Publishing) nor NUGET_API_KEY is configured yet; skipping NuGet.org push."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$EFFECTIVE_NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "v${{ needs.check-version.outputs.version }}" || true
          git push origin "v${{ needs.check-version.outputs.version }}" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
